<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正在启动</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffffff; color: #6b7280;
  }
  @media (prefers-color-scheme: dark) { body { background: #111827; color: #9ca3af; } }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2.5px solid currentColor; border-top-color: transparent;
    opacity: 0.55; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .label { font-size: 13.5px; letter-spacing: 0.02em; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s } }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div class="label">正在启动…</div>
</body>
</html>
